id = "maven"
name = "Maven"
schema_version = 1
version = "0.0.1"
authors = ["weirdo-adam <adam.ngc2237@gmail.com>"]
description = "Maven pom.xml support: schema validation and dependency completion."
repository = "https://github.com/weirdo-adam/zed-maven"

# NOTE: XML syntax highlighting/outline is intentionally NOT provided here.
# Install the `xml` extension (https://github.com/sweetppro/zed-xml); this
# extension attaches its language servers to that "XML" language.

[language_servers.lemminx-maven]
name = "LemMinX Maven"
languages = ["XML"]
