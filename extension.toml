id = "spring-suite"
name = "Spring Suite (Maven & Spring Boot)"
schema_version = 1
version = "0.0.1"
authors = ["Pengfei Li"]
description = "Maven pom.xml & Spring Boot intelligence for Zed: LemMinX (schema-aware completion/validation) with lemminx-maven (dependency completion), plus the Spring Boot language server. Syntax highlighting is provided by the separate `xml` extension."
repository = "https://github.com/pengfei-li/zed-spring-suite"

# NOTE: XML syntax highlighting/outline is intentionally NOT provided here.
# Install the `xml` extension (https://github.com/sweetppro/zed-xml); this
# extension attaches its language servers to that "XML" language.
#
# [grammars.xml]  -> removed, see git history (M0 prototype)

[language_servers.lemminx-maven]
name = "LemMinX Maven"
languages = ["XML"]
